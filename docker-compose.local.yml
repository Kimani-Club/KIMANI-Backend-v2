services:
  redis:
    image: eqalpha/keydb
    ports:
      - "6379:6379"

  database:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - ./.data/db:/data/db

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./.data/minio:/data
    ports:
      - "10000:9000"
    restart: always

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set minio http://minio:9000 minio minio123; do echo 'Waiting minio...' && sleep 1; done;
      /usr/bin/mc mb minio/attachments || true;
      /usr/bin/mc mb minio/avatars || true;
      /usr/bin/mc mb minio/backgrounds || true;
      /usr/bin/mc mb minio/icons || true;
      /usr/bin/mc mb minio/banners || true;
      /usr/bin/mc mb minio/emojis || true;
      exit 0;
      "

  autumn:
    image: ghcr.io/revoltchat/autumn:1.1.5
    depends_on:
      - database
      - createbuckets
    environment:
      AUTUMN_MONGO_URI: mongodb://database
      AUTUMN_PUBLIC_URL: http://localhost:3000
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "0"
    ports:
      - "3000:3000"
    restart: always

  january:
    image: ghcr.io/revoltchat/january:0.3.4
    ports:
      - "7000:7000"
    restart: always

  delta:
    image: rust:1.78-bullseye
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target
    depends_on:
      - database
      - redis
      - autumn
      - january
    environment:
      MONGODB: mongodb://database:27017
      REDIS_URI: redis://redis/
      REVOLT_APP_URL: http://localhost:5000
      REVOLT_PUBLIC_URL: http://localhost:8001
      REVOLT_EXTERNAL_WS_URL: ws://localhost:9000
      AUTUMN_PUBLIC_URL: http://localhost:3000
      JANUARY_PUBLIC_URL: http://localhost:7000
      REVOLT_UNSAFE_NO_CAPTCHA: "1"
      REVOLT_UNSAFE_NO_EMAIL: "1"
      REVOLT_INVITE_ONLY: "0"
      REVOLT_MAX_GROUP_SIZE: "150"
      REVOLT_VAPID_PRIVATE_KEY: 
      REVOLT_VAPID_PUBLIC_KEY: BGcvgR-i2z4IQ5Mw841vJvkLjt8wY-FjmWrw83jOLCY52qcGZS0OF7nfLzuYbjsQISwVO2HXrmf18gLWVX3Kwfw=
    command: >
      bash -c "/usr/local/cargo/bin/cargo run -p revolt-delta"
    ports:
      - "8001:8000"

  bonfire:
    image: rust:1.78-bullseye
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target
    depends_on:
      - database
      - redis
    environment:
      MONGODB: mongodb://database:27017
      REDIS_URI: redis://redis/
      HOST: 0.0.0.0:9000
      RUST_BACKTRACE: "1"
    command: >
      bash -c "/usr/local/cargo/bin/cargo run -p revolt-bonfire"
    ports:
      - "9000:9000"

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
