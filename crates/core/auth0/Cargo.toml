[package]
name = "kimani-auth0"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
async-trait = "0.1.51"
futures = "0.3.19"
jsonwebtoken = { version = "9.3.1", default-features = false }
log = "0.4"
once_cell = "1.9.0"
reqwest = { version = "0.11.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
async-std = { version = "1.8.0", features = ["attributes", "tokio1"] }
