name: Rust build, test, and generate specification

on:
  push:
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/rust.yaml"
      - ".vscode/**"
      - "stack/**"
      - ".gitignore"
      - "LICENSE"
      - "README"
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Run cargo build
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1
        with:
          command: build

      - name: Run services in background
        run: |
          docker compose -f docker-compose.db.yml up -d

      - name: Run cargo test
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1
        with:
          command: test

      - name: Run cargo test (with MongoDB)
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1
        env:
          MONGODB: mongodb://localhost
        with:
          command: test

      - name: Copy .env.example
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: |
          cp .env.example .env

      - name: Start API in background
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: |
          cargo run --bin revolt-delta &

      - name: Wait for API to go up
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: nev7n/wait_for_response@7fef3c1a6e8939d0b09062f14fec50d3c5d15fa1 # v1
        with:
          url: "http://localhost:8000/"

      - name: Checkout API repository
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: actions/checkout@v4
        with:
          repository: revoltchat/api
          path: api
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download OpenAPI specification
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: curl http://localhost:8000/openapi.json -o api/OpenAPI.json

      - name: Commit changes
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: EndBug/add-and-commit@a988073222b8bd50f3ecfca9c0ab7dfbf0d08ceb # v4
        with:
          cwd: "api"
          add: "*.json"
          author_name: Revolt CI
          author_email: revolt-ci@users.noreply.github.com
          message: "chore: generate OpenAPI specification"
